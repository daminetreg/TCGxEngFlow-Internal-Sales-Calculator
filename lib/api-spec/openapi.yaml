openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /pricing:
    get:
      operationId: getMachinePrice
      summary: Fetch a current public hourly machine price
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, enum: [aws, azure, gcp] }
        - in: query
          name: region
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
        - in: query
          name: instanceType
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Current Linux on-demand price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinePrice" }
        "400":
          description: Invalid selection
        "503":
          description: Pricing unavailable; enter a manual hourly rate
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MachinePrice:
      type: object
      required: [provider, region, instanceType, hourlyUsd, vcpus, source, sourceUrl, fetchedAt, description]
      properties:
        provider: { type: string }
        region: { type: string }
        instanceType: { type: string }
        hourlyUsd: { type: number, minimum: 0 }
        vcpus: { type: integer, minimum: 1 }
        source: { type: string }
        sourceUrl: { type: string }
        fetchedAt: { type: string }
        description: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

